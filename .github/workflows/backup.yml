name: Sauvegarde de la base

# Every night: pg_dump of the database, encrypted with BACKUP_PASSPHRASE (AES-256),
# kept 30 days as a workflow artifact. Needs two repository secrets:
# DATABASE_URL (the Neon connection string) and BACKUP_PASSPHRASE (a long passphrase).
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Secrets présents
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Ajoute les secrets DATABASE_URL et BACKUP_PASSPHRASE (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - name: Dump chiffré
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          # pg_dump from a recent image dumps any older server version.
          docker run --rm -e DATABASE_URL postgres:18 \
            pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges > matourun.dump
          test -s matourun.dump
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "matourun-$(date -u +%F).dump.gpg" matourun.dump
          shred -u matourun.dump
      - uses: actions/upload-artifact@v4
        with:
          name: matourun-backup
          path: matourun-*.dump.gpg
          retention-days: 30
          if-no-files-found: error
