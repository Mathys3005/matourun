services:
  - type: web
    name: matourun
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      # Free Postgres connection string (Neon recommended), e.g. postgres://user:pass@host/db?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Code you choose, only used to create the very first (admin) account.
      # Everyone else is invited from the app (Profil > Qui a accès).
      - key: SETUP_CODE
        sync: false
      # Reads the club screenshots (free key from aistudio.google.com).
      - key: GEMINI_API_KEY
        sync: false
      # Garmin Connect account the workouts are sent to.
      - key: GARMIN_EMAIL
        sync: false
      - key: GARMIN_PASSWORD
        sync: false
